[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "alz-perturb-gan"
version = "0.1.0"
description = "Learning experiment: GAN-trained decision models for cell perturbation phenocopy. Not a medical tool."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Differential AI Lab"}]
# These dependencies install the older synthetic smoke package in src/ only.
# The human-microglia EMPF research environment is pinned separately in
# envs/microglia-research-py311.txt (see envs/README.md).
dependencies = [
    "numpy>=1.26,<3",
    "particlegan==0.8.0",
    "torch>=2.6,<3",
]

[project.optional-dependencies]
# HyperGAN 1.0.0-rc2 (PyPI hypergan==1.0.6) does not import on this stack.
# The develop commit below is the rebuild that actually trains. It is not a
# PyPI release. See README.
hypergan = [
    "hndl>=0.8.0",
    "hypergan @ git+https://github.com/HyperGAN/HyperGAN.git@01a3aaec45f49923922787b0412a30fd71a2c897",
]
vcc = [
    "anndata>=0.10",
]
dev = [
    "pytest>=8",
    "anndata>=0.10",
]

[project.scripts]
alz-perturb-smoke = "alz_perturb_gan.smoke:main"

[project.urls]
Repository = "https://github.com/difflabai/alz-perturb-gan"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `pytest` from the repository root runs the data-free default selection.
# See tests/README.md for the commands, markers and skip rules.
testpaths = ["tests", "paper_watch/tests"]
# src: legacy alz_perturb_gan package. ".": `paper_watch.alztest` imports when
# pytest is launched as a console script rather than `python -m pytest`.
# tests/support: the repository plugin (path setup and explicit skip rules).
pythonpath = ["src", ".", "tests/support"]
addopts = ["-q", "-rs", "-p", "alz_pytest_plugin", "-m", "not legacy_pg080"]
markers = [
    "legacy_pg080: older synthetic smoke study in src/alz_perturb_gan; needs torch and particlegan 0.8.x (envs/legacy-pg080.txt). Deselected by default; select with -m legacy_pg080.",
    "needs_local_workspace: needs ignored machine-local inventories, artifacts or absolute workspace paths; skipped with a reason when they are absent.",
    "needs_data: needs a local dataset under data/ or a downloaded public file; skipped with a reason when it is absent.",
    "needs_particlegan: needs the frozen ParticleGAN 0.10.0 site-packages (skipped when absent)",
    "gpu: needs CUDA; never run in CI.",
]
