[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "alz-perturb-gan"
version = "0.1.0"
description = "Learning experiment: GAN-trained decision models for cell perturbation phenocopy. Not a medical tool."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Differential AI Lab"}]
dependencies = [
    "numpy>=1.26,<3",
    "particlegan @ git+https://github.com/255BITS/ParticleGAN.git@6a91a49910568720b2fdfd040ee5891c7d2bde46",
    "torch>=2.6,<3",
]

[project.optional-dependencies]
# HyperGAN 1.0.0-rc2 (PyPI hypergan==1.0.6) does not import on this stack.
# The develop commit below is the rebuild that actually trains. It is not a
# PyPI release. See README.
hypergan = [
    "hndl>=0.8.2",
    "hypergan @ git+https://github.com/HyperGAN/HyperGAN.git@ce6b67e04f1d1e93e6ab417f4bae843bb761c1a0",
]
vcc = [
    "anndata>=0.10",
]
eval = [
    "cell-eval==0.8.2",
]
dev = [
    "pytest>=8",
    "anndata>=0.10",
]

[project.scripts]
alz-perturb-smoke = "alz_perturb_gan.smoke:main"
alz-perturb-real = "alz_perturb_gan.real_data:main"

[project.urls]
Repository = "https://github.com/difflabai/alz-perturb-gan"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
